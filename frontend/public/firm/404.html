<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting…</title>
    <meta name="robots" content="noindex" />
    <style>
      html,body{height:100%;margin:0}
      body{display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,sans-serif;color:#111}
    </style>
  </head>
  <body>
    <noscript>This page requires JavaScript to redirect. Please go to the home page.</noscript>
    <script>
      (function() {
        try {
          var path = window.location.pathname.replace(/\/$/, "");
          var search = window.location.search || "";
          var hash = window.location.hash || "";

          var map = {
            "/intake": "/client-intake",
            "/client-intake": "/client-intake",
            "/login": "/auth",
            "/staff-login": "/auth",
            "/signin": "/auth"
          };

          var targetPath = map[path] || path || "/";
          var redirect = "/#" + targetPath + search + hash;

          // Avoid redirect loops
          if (window.location.hash && window.location.hash.indexOf("#/") === 0) {
            redirect = "/" + window.location.hash; // already hashed
          }

          window.location.replace(redirect);
        } catch (e) {
          // As a last resort, send to app root
          window.location.replace("/#/");
        }
      })();
    </script>
  </body>
</html>
